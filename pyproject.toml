[project]
name = "vertigo"
version = "0.1.0"
description = "A self-hosted generative media powerhouse built on fal.ai"
readme = "README.md"
authors = [
    { name = "Evelyn", email = "evvyraine@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fal-client>=1.0.1",
    "streamlit[auth]>=1.63.0",
]

[project.scripts]
vertigo = "vertigo:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
